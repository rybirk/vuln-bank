name: Trigger auto deployment for vulnbank

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/vulnbank-AutoDeployTrigger-d0987216-1389-404c-a522-fec30a546b1f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.VULNBANK_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.VULNBANK_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.VULNBANK_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.VULNBANK_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.VULNBANK_REGISTRY_PASSWORD }}
          containerAppName: vulnbank
          resourceGroup: rg-VulnBank
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


